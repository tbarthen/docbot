<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DocBot options</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; color: #212529; margin: 0; padding: 20px; min-width: 420px; }
    h1 { font-size: 18px; margin: 0 0 16px; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: #6c757d; margin: 20px 0 8px; }
    label { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; cursor: pointer; }
    label input { margin-top: 3px; accent-color: #667eea; }
    label small { display: block; color: #6c757d; margin-top: 2px; }
    .sub { margin-left: 26px; }
    .saved { color: #28a745; font-size: 12px; height: 16px; margin-top: 12px; }
    .note { background: #f8f9fa; border-radius: 6px; padding: 10px 12px; color: #495057; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>DocBot options</h1>

  <h2>Privacy</h2>
  <label>
    <input type="checkbox" id="recordInputValues">
    <span>Record the text typed into form fields
      <small>Off by default. When off, the log only notes that a field was changed. Password and payment fields are never recorded. Screenshots still show whatever is on screen.</small>
    </span>
  </label>

  <h2>Auto-fill</h2>
  <label>
    <input type="checkbox" id="enableAutoFill">
    <span>Fill empty form fields with test data while recording
      <small>Also available any time from the right-click menu on a field: "DocBot: auto-fill this field".</small>
    </span>
  </label>
  <label class="sub">
    <input type="checkbox" id="useRealisticData" checked>
    <span>Use realistic names and addresses</span>
  </label>

  <h2>Storage</h2>
  <div class="note">
    Recordings stay in this browser profile only. The last three recordings are kept; older ones are deleted when a new recording ends. Use <b>Save as HTML</b> on the report page to keep a permanent copy.
  </div>

  <div class="saved" id="saved"></div>

  <script src="options.js"></script>
</body>
</html>
